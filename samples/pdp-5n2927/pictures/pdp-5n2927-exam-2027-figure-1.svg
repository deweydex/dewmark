<svg viewBox="0 0 360 330" role="img" xmlns="http://www.w3.org/2000/svg"><title>Flowchart of a while loop</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs><g fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="150" cy="16" r="5" fill="currentColor"/><line x1="150" y1="21" x2="150" y2="62" marker-end="url(#ah)"/><polygon points="150,64 212,100 150,136 88,100" fill="var(--accent)" stroke="var(--accent)"/><line x1="150" y1="136" x2="150" y2="178" marker-end="url(#ah)"/><rect x="100" y="180" width="100" height="40" fill="var(--accent)" stroke="var(--accent)"/><polyline points="150,220 150,250 40,250 40,100 86,100" marker-end="url(#ah)"/><polyline points="212,100 262,100 262,280 150,280 150,296" marker-end="url(#ah)"/><circle cx="150" cy="310" r="9"/><circle cx="150" cy="310" r="5" fill="currentColor"/></g><g font-family="system-ui, sans-serif" font-size="12" fill="currentColor"><text x="172" y="30">while condition:</text><text x="188" y="45">statement(s)</text><text x="150" y="104" text-anchor="middle" fill="var(--on-accent)" font-weight="bold">condition</text><text x="158" y="160">if condition</text><text x="158" y="173">is true</text><text x="150" y="198" text-anchor="middle" fill="var(--on-accent)" font-weight="bold">conditional</text><text x="150" y="212" text-anchor="middle" fill="var(--on-accent)" font-weight="bold">code</text><text x="270" y="170">if condition</text><text x="270" y="185">is false</text></g></svg>