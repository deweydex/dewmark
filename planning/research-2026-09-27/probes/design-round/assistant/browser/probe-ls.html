<!doctype html><meta charset="utf-8"><title>llama-server probe</title><body><script>
const R = {origin: location.origin, steps: []}; const L = "http://127.0.0.1:8080";
const log = (k, v) => R.steps.push([k, v]);
(async () => {
  for (const [label, key] of [["no key", null], ["wrong key", "nope"], ["right key", "s3cret"]]) {
    try { const h = {"Content-Type": "application/json"}; if (key) h.Authorization = "Bearer " + key;
      const r = await fetch(L + "/v1/models", {headers: h}); log(label, r.status + " " + (await r.text()).slice(0, 90)); }
    catch (e) { log(label, e.name + ": " + e.message); } }
  try { const r = await fetch(L + "/health"); log("health", r.status + " " + await r.text()); } catch (e) { log("health", String(e)); }
  const pre = document.createElement("pre"); pre.id = "out"; pre.textContent = JSON.stringify(R, null, 1); document.body.appendChild(pre);
})();
</script>
