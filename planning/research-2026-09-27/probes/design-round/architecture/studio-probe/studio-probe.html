<!doctype html>
<meta charset="utf-8">
<title>studio probe</title>
<script src="./pyodide/pyodide.js"></script>
<script>
window.RESULTS = {done: false, log: []};
const log = (m) => { window.RESULTS.log.push(m); console.log(m); };
(async () => {
  try {
    const t0 = performance.now();
    const py = await loadPyodide({indexURL: new URL("./pyodide/", location).href});
    const tBoot = performance.now();
    log("boot ms " + Math.round(tBoot - t0));
    const wheels = [
      "wheels/pyyaml-6.0.2-cp313-cp313-pyodide_2025_0_wasm32.whl",
      "wheels/markdown-3.11-py3-none-any.whl",
      "wheels/latex2mathml-3.81.1-py3-none-any.whl",
    ].map(w => new URL(w, location).href);
    await py.loadPackage(wheels, {messageCallback: log, errorCallback: log});
    const tPkgs = performance.now();
    log("packages ms " + Math.round(tPkgs - tBoot));
    const manifest = await (await fetch("manifest.json")).json();
    for (const path of manifest) {
      const bytes = new Uint8Array(await (await fetch(path)).arrayBuffer());
      const full = "/work/" + path;
      py.FS.mkdirTree(full.slice(0, full.lastIndexOf("/")));
      py.FS.writeFile(full, bytes);
    }
    const tFiles = performance.now();
    log("files ms " + Math.round(tFiles - tPkgs));
    const out = py.runPython(`
import sys, hashlib, json, time, platform
sys.path.insert(0, "/work/builder")
import build_exam, markdown, yaml, latex2mathml
from pathlib import Path
res = {"python": sys.version.split()[0], "platform": sys.platform,
       "markdown": markdown.__version__, "yaml": yaml.__version__,
       "libyaml": getattr(yaml, "__with_libyaml__", None), "builds": {}}
for sample in sorted(Path("/work/samples").glob("*.exam.md")):
    t = time.perf_counter()
    written = build_exam.build(sample, "/work/out/" + sample.name[:-8])
    ms = round((time.perf_counter() - t) * 1000)
    res["builds"][sample.name] = {"ms": ms, "files": {p.name: [p.stat().st_size, hashlib.sha256(p.read_bytes()).hexdigest()] for p in written}}
# a broken copy: change total_marks and misspell a type, to see the teacher-facing errors
src = Path("/work/samples/sample-mixed-paper.exam.md").read_text()
import re
broken = re.sub(r"total_marks: *\\d+", "total_marks: 99", src, count=1)
broken = broken.replace("type: multiple-choice", "type: multiple-choise", 1)
Path("/work/samples/broken-copy.md").write_text(broken)
try:
    build_exam.build("/work/samples/broken-copy.md", "/work/out/broken", check_only=True)
    res["broken"] = "no error?"
except build_exam.BuildError as e:
    res["broken"] = [m for _, m in e.problems][:6]
json.dumps(res)
`);
    const tRun = performance.now();
    window.RESULTS.result = JSON.parse(out);
    window.RESULTS.timing = {boot: tBoot - t0, packages: tPkgs - tBoot, files: tFiles - tPkgs, run: tRun - tFiles, total: tRun - t0};
  } catch (e) {
    window.RESULTS.error = String(e && e.stack || e);
  }
  window.RESULTS.done = true;
})();
</script>
