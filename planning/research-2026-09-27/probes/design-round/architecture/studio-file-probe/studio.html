const BASE = "https://pyodide.invalid/";
let files = null;
const realFetch = self.fetch.bind(self);
self.fetch = (url, opts) => { const u = String(url);
  if (u.startsWith(BASE)) { const name = u.slice(BASE.length).split("?")[0]; const buf = files[name];
    if (!buf) return Promise.resolve(new Response("missing", {status: 404}));
    return Promise.resolve(new Response(buf, {headers: {"Content-Type": name.endsWith(".wasm") ? "application/wasm" : "application/octet-stream"}})); }
  return realFetch(url, opts); };
self.onmessage = async (e) => { const t0 = performance.now();
  try { files = e.data.files; const dec = new TextDecoder();
    importScripts(URL.createObjectURL(new Blob([files["pyodide.js"]])));
    importScripts(URL.createObjectURL(new Blob([files["pyodide.asm.js"]])));
    const py = await loadPyodide({indexURL: BASE, lockFileContents: dec.decode(files["pyodide-lock.json"]), stdLibURL: BASE + "python_stdlib.zip", packageBaseUrl: BASE});
    const tBoot = performance.now();
    await py.loadPackage(Object.keys(files).filter(n => n.endsWith(".whl")).map(n => BASE + n));
    for (const [path, buf] of Object.entries(e.data.work)) { const full = "/work/" + path; py.FS.mkdirTree(full.slice(0, full.lastIndexOf("/"))); py.FS.writeFile(full, new Uint8Array(buf)); }
    const out = py.runPython(`
import sys, hashlib, json
sys.path.insert(0, "/work/builder")
import build_exam
written = build_exam.build("/work/samples/sample-mixed-paper.exam.md", "/work/out")
json.dumps({p.name: hashlib.sha256(p.read_bytes()).hexdigest() for p in written})`);
    postMessage({ok: true, hashes: JSON.parse(out), bootMs: tBoot - t0, totalMs: performance.now() - t0});
  } catch (err) { postMessage({ok: false, error: String(err && err.stack || err)}); } };
</script>
<script>
window.RESULTS = {done: false};
(async () => { const t0 = performance.now();
  const toBuf = async (d) => (await fetch("data:application/octet-stream;base64," + d)).arrayBuffer();
  const files = {}; for (const [n, d] of Object.entries(window.DEWMARK_PY)) files[n] = await toBuf(d);
  const workSrc = JSON.parse(document.getElementById("work").textContent); const work = {};
  for (const [n, d] of Object.entries(workSrc)) work[n] = await toBuf(d);
  const w = new Worker(URL.createObjectURL(new Blob([document.getElementById("worker-src").textContent])));
  w.onmessage = (e) => { window.RESULTS = Object.assign({done: true, protocol: location.protocol, pageToBuiltMs: performance.now() - t0}, e.data); };
  w.postMessage({files, work});
})();
</script>
