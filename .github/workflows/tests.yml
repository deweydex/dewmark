# The checks every change must pass: the builder's tests and builds in one
# job, and the browser rehearsals in another, since they need Chromium.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Run the exam builder's tests
        run: python -m pytest --ignore=tests/browser

      - name: Build every sample exam
        run: |
          for exam in samples/*.exam.md; do
            python build_exam.py "$exam" --output /tmp/dewmark-out
          done

      - name: Build the site
        run: python dev/build_site.py

      # .gitignore keeps real papers and submissions out, but `git add -f`
      # gets past it; this is the second lock (DECISIONS_LOG.md, entry 0.4).
      - name: Refuse real papers and submissions
        run: |
          bad=$(git ls-files | grep -E '^private/|\.zip$|(^|/)dewmark_[^/]*$' || true)
          strays=$(git ls-files '*.exam.md' | grep -vE '^(samples|experiments)/' || true)
          if [ -n "$bad$strays" ]; then
            echo "These files must not be committed:"; echo "$bad"; echo "$strays"; exit 1
          fi

  # The page's worst bugs live in the browser, not the builder: what is
  # written to storage, and when (DECISIONS_LOG.md, entry 0.6). These run
  # the saving rehearsals and the end-to-end smoke test in Chromium.
  # DEWMARK_REQUIRE_BROWSER turns a missing browser into a failure rather
  # than a skip, so a rehearsal cannot pass by not running. The Python
  # smoke test stays hand-run: it downloads Pyodide from the internet.
  rehearsals:
    runs-on: ubuntu-latest
    env:
      DEWMARK_REQUIRE_BROWSER: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m playwright install --with-deps chromium

      - name: The saving rehearsals
        run: python -m pytest tests/browser

      - name: The end-to-end smoke test
        run: python dev/smoke_pages.py
